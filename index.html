<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekanism Planner v6.5</title>
    <style>
        /* --- デザイン規定 --- */
        :root {
            --bg-color: #1a1a1d; --card-bg: #2d2d30; --input-bg: #1a1a1d;
            --dark-accent: #1C1361; --main-accent: #5d9bc0; --hover-color: #2A5669;
            --highlight-text: #5d9bc0; --text-color: #e0e0e0; --sub-text-color: #888;
            --border-color: #444; --error-color: #ff6b6b; --success-color: #56c596;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f0f2f5; --card-bg: #ffffff; --input-bg: #f7f9fc;
                --dark-accent: #1C1361; --main-accent: #5d9bc0; --hover-color: #2A5669;
                --highlight-text: #1C1361; --text-color: #333333; --sub-text-color: #666666;
                --border-color: #dce0e5; --error-color: #d32f2f; --success-color: #2a8a68;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 10px; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        header { flex: 0 0 auto; text-align: center; margin-bottom: 10px; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--highlight-text); }

        .main-container {
            display: flex; flex: 1 1 auto; gap: 15px; overflow: hidden;
        }
        
        @media (max-width: 900px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            body { overflow: auto; }
        }

        .panel-left {
            flex: 1 1 320px;
            min-width: 300px; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .panel-left::-webkit-scrollbar { width: 6px; }
        .panel-left::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 3px; }

        .panel-right {
            flex: 2 1 0;
            display: flex; flex-direction: column;
            min-width: 0;
        }

        .card {
            background-color: var(--card-bg); padding: 15px; border-radius: 12px;
            border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; color: var(--text-color); }
        .en-label { font-weight: normal; font-size: 0.75rem; color: var(--sub-text-color); margin-left: 3px; }

        .number-control {
            display: flex; align-items: center; border: 1px solid var(--border-color);
            border-radius: 6px; background-color: var(--input-bg); overflow: hidden; position: relative;
        }
        .number-control:focus-within { border-color: var(--highlight-text); }
        input[type="number"] {
            flex: 1; width: 100%; padding: 8px; border: none; background: transparent;
            color: var(--text-color); text-align: center; font-size: 1rem;
        }
        input[type="number"]:focus { outline: none; }

        button.toggle-btn {
            background-color: var(--dark-accent); border: 1px solid var(--dark-accent); color: #fff;
            padding: 10px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        button.toggle-btn:hover { background-color: var(--hover-color); }
        button.toggle-btn.inactive { background-color: transparent; color: var(--text-color); border-color: var(--border-color); }

        .canvas-container {
            flex: 1; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.05); border-radius: 8px;
            overflow: hidden; border: 1px solid var(--border-color); position: relative;
            cursor: crosshair; /* 操作可能であることを示す */
        }
        
        /* エラーメッセージ (トースト) */
        .ui-overlay-fixed {
            position: absolute; top: 10px; right: 10px; pointer-events: none;
            display: flex; flex-direction: column; align-items: flex-end; z-index: 10;
        }
        .toast-msg {
            background: rgba(255, 60, 60, 0.9); color: white; padding: 8px 16px; border-radius: 4px;
            font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: right;
        }
        .toast-msg.show { opacity: 1; }
        .toast-msg.warning { background: rgba(255, 165, 0, 0.9); color: #fff; }

        /* フローティングツールチップ */
        .floating-tooltip {
            position: fixed; pointer-events: none; z-index: 100;
            background: rgba(0, 0, 0, 0.8); color: #fff; padding: 6px 10px;
            border-radius: 4px; font-size: 0.8rem; white-space: nowrap;
            transform: translate(15px, 15px); /* マウスの右下に表示 */
            opacity: 0; transition: opacity 0.1s;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
        }
        .floating-tooltip.show { opacity: 1; }

        /* リスト */
        .action-list { list-style: none; padding: 0; margin: 0; }
        .action-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 0.95rem;
        }
        .action-item:last-child { border-bottom: none; }
        
        /* --- CSS 3D Icon & Visibility Fix --- */
        .icon-container {
            width: 30px; height: 30px; margin-right: 12px;
            display: flex; align-items: center; justify-content: center;
            /* 視認性向上のための背景と枠 */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        
        .item-icon-img { width: 80%; height: 80%; object-fit: contain; }

        /* 立体ブロックアイコン */
        .cube-icon {
            width: 14px; height: 14px; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(45deg);
        }
        .cube-face {
            position: absolute; width: 14px; height: 14px;
            background-size: cover; background-repeat: no-repeat;
            image-rendering: pixelated;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }
        /* 明暗差をつけて立体感を出す */
        .cube-face.front { transform: translateZ(7px); filter: brightness(1.0); }
        .cube-face.top   { transform: rotateX(90deg) translateZ(7px); filter: brightness(1.2); }
        .cube-face.right { transform: rotateY(90deg) translateZ(7px); filter: brightness(0.7); }

        .item-name { display: flex; align-items: center; }
        .footer-signature { font-size: 0.8rem; color: #2A5669; font-weight: bold; text-align: right; margin-top: 5px; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>Mekanism Planner <small style="font-size: 0.6em; opacity: 0.7;">v6.5</small></h1>
    </header>

    <div class="main-container">
        <div class="panel-left">
            <div class="card">
                <div class="input-row">
                    <div class="input-group">
                        <label>幅 X</label>
                        <div class="number-control">
                            <input type="number" v-model.number="dims.x" min="3" max="18" @wheel.prevent="handleWheel($event, 'x')">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>奥行 Z</label>
                        <div class="number-control">
                            <input type="number" v-model.number="dims.z" min="3" max="18" @wheel.prevent="handleWheel($event, 'z')">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>高さ Y</label>
                        <div class="number-control">
                            <input type="number" v-model.number="dims.y" min="3" max="18" @wheel.prevent="handleWheel($event, 'y')">
                        </div>
                    </div>
                </div>

                <button class="toggle-btn" :class="{ inactive: !useGlass }" @click="useGlass = !useGlass">
                    <span>構造用ガラス <span class="en-label">/ Glass</span></span>
                    <span>{{ useGlass ? 'ON' : 'OFF' }}</span>
                </button>
            </div>

            <div class="card">
                <div style="text-align: center; margin-bottom: 15px;">
                    <div class="en-label">Fluid Capacity</div>
                    <div style="font-size: 2rem; font-weight: bold; color: var(--highlight-text);">
                        {{ formatNumber(volume * 16000) }} <span style="font-size: 1rem; color: var(--sub-text-color);">mB</span>
                    </div>
                    <div class="en-label">(Gas: {{ formatNumber(volume * 160000) }} mB)</div>
                </div>

                <ul class="action-list">
                    <li v-for="(count, name) in blocks" :key="name" class="action-item">
                        <div class="item-name">
                            <div class="icon-container">
                                <div v-if="isBlock(name)" class="cube-icon">
                                    <div class="cube-face front" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                    <div class="cube-face top" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                    <div class="cube-face right" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                </div>
                                <img v-else :src="getIconPath(name)" class="item-icon-img" @error="onImgError">
                            </div>
                            <div>{{ translate(name) }}</div>
                        </div>
                        <div style="font-weight: bold;">{{ count }}</div>
                    </li>
                </ul>

                <div style="margin: 10px 0; border-top: 1px solid var(--border-color);"></div>

                <ul class="action-list">
                    <li v-for="(count, name) in rawMaterials" :key="name" class="action-item">
                        <div class="item-name">
                            <div class="icon-container">
                                <div v-if="isBlock(name)" class="cube-icon">
                                    <div class="cube-face front" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                    <div class="cube-face top" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                    <div class="cube-face right" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                </div>
                                <img v-else :src="getIconPath(name)" class="item-icon-img" @error="onImgError">
                            </div>
                            <div>{{ translate(name) }} <span style="font-size:0.7em; opacity:0.6;">(素材)</span></div>
                        </div>
                        <div style="font-weight: bold;">{{ count }}</div>
                    </li>
                </ul>
            </div>
            
            <div class="footer-signature">edamae</div>
        </div>

        <div class="panel-right">
            <div id="three-canvas" class="canvas-container">
                <div class="ui-overlay-fixed">
                    <div class="toast-msg" :class="{ show: toastMessage }">{{ toastMessage }}</div>
                    <div class="toast-msg warning" :class="{ show: persistentError }" style="pointer-events: auto;">⚠ {{ persistentError }}</div>
                </div>
            </div>
            <div class="floating-tooltip" :class="{ show: tooltip.visible }" :style="{ top: tooltip.y + 'px', left: tooltip.x + 'px' }">
                {{ tooltip.text }}
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const { createApp, ref, computed, watch, onMounted, onBeforeUnmount } = Vue;

    createApp({
        setup() {
            // --- State ---
            const dims = ref({ x: 3, y: 5, z: 3 });
            const useGlass = ref(true);
            const valveCoords = ref(new Set()); 
            const toastMessage = ref('');
            let toastTimer = null;

            // ツールチップ用
            const tooltip = ref({ visible: false, x: 0, y: 0, text: '' });
            const hasInteracted = ref(false); // 一度でも操作したかどうか

            // --- Constants ---
            const translations = {
                'Dynamic Tank': 'ダイナミックタンク',
                'Structural Glass': '構造用ガラス',
                'Dynamic Valve': 'ダイナミックバルブ',
                'Steel Ingot': '鋼鉄インゴット',
                'Bucket': 'バケツ',
                'Glass': 'ガラス',
                'Basic Control Circuit': '基本制御回路'
            };
            const iconMap = {
                'Dynamic Tank': './assets/dynamic_tank.png',
                'Structural Glass': './assets/structural_glass.png',
                'Dynamic Valve': './assets/dynamic_valve.png',
                'Steel Ingot': './assets/ingot_steel.png',
                'Bucket': './assets/bucket.png',
                'Glass': './assets/glass.png',
                'Basic Control Circuit': './assets/basic_control_circuit.png'
            };
            const recipes = {
                'Dynamic Valve': { 'Dynamic Tank': 2, 'Basic Control Circuit': 0.5 },
                'Dynamic Tank': { 'Steel Ingot': 1, 'Bucket': 0.25 },
                'Structural Glass': { 'Steel Ingot': 1, 'Glass': 0.25 }
            };
            const textures = { tank: null, glass: null, valve: null };

            // --- Helpers ---
            const translate = (key) => translations[key] || key;
            const getIconPath = (key) => iconMap[key] || '';
            const onImgError = (e) => { e.target.style.display = 'none'; };
            const formatNumber = (n) => n.toLocaleString();
            
            // ガラスもブロックとして扱うように追加
            const isBlock = (name) => {
                return ['Dynamic Tank', 'Structural Glass', 'Dynamic Valve', 'Glass'].includes(name);
            };

            const showToast = (msg) => {
                toastMessage.value = msg;
                if(toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toastMessage.value = ''; }, 2000);
            };

            const handleWheel = (e, target) => {
                const delta = e.deltaY < 0 ? 1 : -1;
                let v = dims.value[target] + delta;
                if(v < 3) v = 3; if(v > 18) v = 18;
                dims.value[target] = v;
            };

            // --- Logic ---
            const volume = computed(() => {
                const { x, y, z } = dims.value;
                if(x < 3 || y < 3 || z < 3) return 0;
                return (x - 2) * (y - 2) * (z - 2);
            });

            const persistentError = computed(() => {
                if(valveCoords.value.size === 0) return "バルブが設置されていません (No Valves)";
                return "";
            });

            const blocks = computed(() => {
                const { x, y, z } = dims.value;
                const frameCount = (4 * x) + (4 * y) + (4 * z) - 16;
                const totalShell = (x * y * z) - ((x - 2) * (y - 2) * (z - 2));
                const totalWall = totalShell - frameCount;

                let validValveCount = 0;
                valveCoords.value.forEach(coord => {
                    const [vx, vy, vz] = coord.split(',').map(Number);
                    if (vx >= -(x-1)/2 && vx <= (x-1)/2 &&
                        vy >= -(y-1)/2 && vy <= (y-1)/2 &&
                        vz >= -(z-1)/2 && vz <= (z-1)/2) {
                        validValveCount++;
                    }
                });

                let result = {};
                if (validValveCount > 0) result['Dynamic Valve'] = validValveCount;
                result['Dynamic Tank'] = frameCount;

                const remainingWall = Math.max(0, totalWall - validValveCount);
                if (useGlass.value) result['Structural Glass'] = remainingWall;
                else result['Dynamic Tank'] += remainingWall;

                return result;
            });

            const rawMaterials = computed(() => {
                let totals = {};
                const decompose = (itemName, quantity) => {
                    const recipe = recipes[itemName];
                    if (recipe) for (const [subItem, subQty] of Object.entries(recipe)) decompose(subItem, subQty * quantity);
                    else totals[itemName] = (totals[itemName] || 0) + quantity;
                };
                for (const [name, count] of Object.entries(blocks.value)) decompose(name, count);
                let rounded = {};
                for (const [k, v] of Object.entries(totals)) rounded[k] = Math.ceil(v);
                return rounded;
            });

            // --- Three.js ---
            let scene, camera, renderer, controls, meshGroup;
            let raycaster, mouse;
            let interactiveMeshes = [];
            // ドラッグ判定用の変数
            let isDragging = false;
            let mouseDownPos = { x: 0, y: 0 };
            let mouseDownTime = 0;

            const initThree = () => {
                const container = document.getElementById('three-canvas');
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
                camera.position.set(10, 8, 12); 

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                
                const dl = new THREE.DirectionalLight(0xffffff, 1.2);
                dl.position.set(10, 20, 10);
                scene.add(dl);
                scene.add(new THREE.AmbientLight(0x404040));

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();

                window.addEventListener('resize', onResize);
                
                // イベントリスナーの分離 (ドラッグ判定のため)
                const canvas = renderer.domElement;
                canvas.addEventListener('pointerdown', onPointerDown);
                canvas.addEventListener('pointerup', onPointerUp);
                canvas.addEventListener('pointermove', onPointerMove);

                const tl = new THREE.TextureLoader();
                const loadTex = (p, k) => tl.load(p, t => { t.magFilter = THREE.NearestFilter; textures[k] = t; updateMesh(); });
                loadTex('./assets/dynamic_tank.png', 'tank');
                loadTex('./assets/structural_glass.png', 'glass');
                loadTex('./assets/dynamic_valve.png', 'valve');

                updateMesh();
                animate();
            };

            const onResize = () => {
                const container = document.getElementById('three-canvas');
                if (!container || !camera || !renderer) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            };

            // ホバー時の処理 (ツールチップ)
            const onPointerMove = (event) => {
                // 操作済みなら表示しない
                if (hasInteracted.value) {
                    tooltip.value.visible = false;
                    return;
                }

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveMeshes);

                tooltip.value.x = event.clientX;
                tooltip.value.y = event.clientY;

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    const instanceId = hit.instanceId;
                    const mesh = hit.object;

                    if (mesh.userData && mesh.userData.coords && mesh.userData.coords[instanceId]) {
                        const { type } = mesh.userData.coords[instanceId];
                        if (type === 'wall') {
                            tooltip.value.text = "左クリック: バルブ設置";
                            tooltip.value.visible = true;
                        } else if (type === 'valve') {
                            tooltip.value.text = "右クリック: バルブ削除";
                            tooltip.value.visible = true;
                        } else {
                            tooltip.value.visible = false;
                        }
                    } else {
                        tooltip.value.visible = false;
                    }
                } else {
                    tooltip.value.visible = false;
                }
            };

            const onPointerDown = (event) => {
                isDragging = false;
                mouseDownPos = { x: event.clientX, y: event.clientY };
                mouseDownTime = performance.now();
            };

            const onPointerUp = (event) => {
                if (event.button !== 0 && event.button !== 2) return;

                const mouseUpPos = { x: event.clientX, y: event.clientY };
                const moveDist = Math.hypot(mouseUpPos.x - mouseDownPos.x, mouseUpPos.y - mouseDownPos.y);
                const timeDiff = performance.now() - mouseDownTime;

                // 移動距離が5px以上、または時間が300ms以上ならドラッグとみなして処理しない
                if (moveDist > 5 || timeDiff > 300) {
                    return; 
                }

                // ここからクリック判定
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveMeshes);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    const instanceId = hit.instanceId;
                    const mesh = hit.object;

                    if (mesh.userData && mesh.userData.coords && mesh.userData.coords[instanceId]) {
                        const { x, y, z, type } = mesh.userData.coords[instanceId];
                        const coordKey = `${x},${y},${z}`;

                        if (type === 'frame') {
                            showToast("そこには設置できません (Frame)");
                            return;
                        }

                        if (event.button === 0) { // 左クリック
                            if (type !== 'valve') {
                                valveCoords.value.add(coordKey);
                                updateMesh();
                                hasInteracted.value = true;
                            }
                        } else if (event.button === 2) { // 右クリック
                            if (type === 'valve') {
                                valveCoords.value.delete(coordKey);
                                updateMesh();
                                hasInteracted.value = true;
                            }
                        }
                    }
                }
            };

            const updateMesh = () => {
                if(!scene) return;
                if(meshGroup) {
                    scene.remove(meshGroup);
                    meshGroup.children.forEach(c => {
                        if(c.geometry) c.geometry.dispose();
                        if(c.material) (Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose());
                    });
                }
                meshGroup = new THREE.Group();
                scene.add(meshGroup);
                interactiveMeshes = [];

                const { x, y, z } = dims.value;
                if(x < 3 || y < 3 || z < 3) return;

                const frames = [], walls = [], valves = [];
                const frameCoords = [], wallCoords = [], valveCoordsArr = [];

                for(let i=0; i<x; i++) {
                    for(let j=0; j<y; j++) {
                        for(let k=0; k<z; k++) {
                            const posX = i - (x-1)/2;
                            const posY = j - (y-1)/2;
                            const posZ = k - (z-1)/2;

                            const isEdge = ((i===0||i===x-1)?1:0) + ((j===0||j===y-1)?1:0) + ((k===0||k===z-1)?1:0);
                            const mat = new THREE.Matrix4().setPosition(posX, posY, posZ);
                            const coordObj = { x: posX, y: posY, z: posZ };
                            const coordKey = `${posX},${posY},${posZ}`;

                            if (isEdge >= 2) {
                                frames.push(mat);
                                frameCoords.push({ ...coordObj, type: 'frame' });
                            } else if (isEdge === 1) {
                                if (valveCoords.value.has(coordKey)) {
                                    valves.push(mat);
                                    valveCoordsArr.push({ ...coordObj, type: 'valve' });
                                } else {
                                    walls.push(mat);
                                    wallCoords.push({ ...coordObj, type: 'wall' });
                                }
                            }
                        }
                    }
                }

                const geo = new THREE.BoxGeometry(1,1,1);
                
                if(frames.length) {
                    const mat = new THREE.MeshLambertMaterial({ color: textures.tank ? 0xffffff : 0x555555, map: textures.tank });
                    const mesh = new THREE.InstancedMesh(geo, mat, frames.length);
                    frames.forEach((m,i) => mesh.setMatrixAt(i,m));
                    mesh.userData.coords = frameCoords;
                    meshGroup.add(mesh);
                    interactiveMeshes.push(mesh);
                }

                if(valves.length) {
                    const mat = new THREE.MeshLambertMaterial({ color: textures.valve ? 0xffffff : 0xaa8800, map: textures.valve });
                    const mesh = new THREE.InstancedMesh(geo, mat, valves.length);
                    valves.forEach((m,i) => mesh.setMatrixAt(i,m));
                    mesh.userData.coords = valveCoordsArr;
                    meshGroup.add(mesh);
                    interactiveMeshes.push(mesh);
                }

                if(walls.length) {
                    let mat;
                    if(useGlass.value) {
                        mat = new THREE.MeshLambertMaterial({
                            color: textures.glass ? 0xffffff : 0x5d9bc0,
                            map: textures.glass,
                            transparent: true, opacity: textures.glass ? 1.0 : 0.3,
                            side: THREE.DoubleSide, depthWrite: false
                        });
                    } else {
                        mat = new THREE.MeshLambertMaterial({ color: textures.tank ? 0xffffff : 0x555555, map: textures.tank });
                    }
                    const mesh = new THREE.InstancedMesh(geo, mat, walls.length);
                    walls.forEach((m,i) => mesh.setMatrixAt(i,m));
                    mesh.userData.coords = wallCoords;
                    meshGroup.add(mesh);
                    interactiveMeshes.push(mesh);
                }
            };

            const animate = () => {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            };

            watch([dims.value, useGlass], () => {
                updateMesh();
            }, { deep: true });

            onMounted(() => {
                valveCoords.value.add("0,0,1");
                valveCoords.value.add("0,0,-1");
                initThree();
                setTimeout(onResize, 100);
            });

            onBeforeUnmount(() => {
                window.removeEventListener('resize', onResize);
            });

            return {
                dims, useGlass, volume, blocks, rawMaterials,
                formatNumber, translate, getIconPath, onImgError,
                handleWheel, toastMessage, persistentError, isBlock, tooltip
            };
        }
    }).mount('#app');
</script>
</body>
</html>
