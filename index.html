<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekanism Planner v7.2</title>
    <style>
        /* --- デザイン規定 --- */
        :root {
            --bg-color: #1a1a1d; --card-bg: #2d2d30; --input-bg: #1a1a1d;
            --dark-accent: #1C1361; --main-accent: #5d9bc0; --hover-color: #2A5669;
            --highlight-text: #5d9bc0; --text-color: #e0e0e0; --sub-text-color: #888;
            --border-color: #444; --error-color: #ff6b6b; --success-color: #56c596;
            --active-tool-bg: rgba(93, 155, 192, 0.3);
            --active-tool-border: #5d9bc0;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f0f2f5; --card-bg: #ffffff; --input-bg: #f7f9fc;
                --dark-accent: #1C1361; --main-accent: #5d9bc0; --hover-color: #2A5669;
                --highlight-text: #1C1361; --text-color: #333333; --sub-text-color: #666666;
                --border-color: #dce0e5; --error-color: #d32f2f; --success-color: #2a8a68;
                --active-tool-bg: rgba(28, 19, 97, 0.1);
                --active-tool-border: #1C1361;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 10px 20px; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        header { flex: 0 0 auto; text-align: center; margin-bottom: 10px; }
        h1 { margin: 0; font-size: 1.6rem; color: var(--highlight-text); }

        /* --- レイアウト (Flexbox & Grid) --- */
        .container {
            display: flex; gap: 20px; height: 100%; overflow: hidden;
            max-width: 1600px; margin: 0 auto; width: 100%;
        }

        /* 左パネル: 入力エリア */
        .panel-left {
            flex: 0 0 300px; /* 固定幅 */
            display: flex; flex-direction: column; gap: 15px;
        }

        /* 右パネル: プレビュー + 結果 */
        .panel-right {
            flex: 1; /* 残りを埋める */
            display: flex; flex-direction: column; gap: 15px;
            min-width: 0;
        }

        .card {
            background-color: var(--card-bg); padding: 15px; border-radius: 12px;
            border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 入力UI */
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; color: var(--text-color); }
        .en-label { font-weight: normal; font-size: 0.75rem; color: var(--sub-text-color); margin-left: 3px; }

        .number-control {
            display: flex; align-items: center; border: 1px solid var(--border-color);
            border-radius: 6px; background-color: var(--input-bg); overflow: hidden;
        }
        .number-control:focus-within { border-color: var(--highlight-text); }
        input[type="number"] {
            width: 100%; padding: 10px; border: none; background: transparent;
            color: var(--text-color); text-align: left; font-size: 1.1rem;
        }
        input[type="number"]:focus { outline: none; }

        button.toggle-btn {
            background-color: var(--dark-accent); border: 1px solid var(--dark-accent); color: #fff;
            padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 0.95rem; font-weight: bold;
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s; margin-top: 5px;
        }
        button.toggle-btn:hover { background-color: var(--hover-color); transform: translateY(-1px); }
        button.toggle-btn.inactive { background-color: transparent; color: var(--text-color); border-color: var(--border-color); }

        /* 3D View */
        .view-wrapper {
            flex: 1; /* 高さいっぱい */
            min-height: 300px;
            position: relative; background-color: rgba(0,0,0,0.05);
            border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color);
        }
        #three-canvas { width: 100%; height: 100%; outline: none; cursor: crosshair; }

        /* ツールパレット */
        .palette {
            position: absolute; top: 10px; right: 10px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tool-btn {
            width: 40px; height: 40px; border: 2px solid transparent;
            border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); transition: all 0.2s; position: relative;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active { background: var(--active-tool-bg); border-color: var(--active-tool-border); }
        
        /* ツールチップ */
        .tool-tooltip {
            position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px;
            border-radius: 4px; font-size: 0.8rem; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .tool-btn:hover .tool-tooltip { opacity: 1; }

        /* 結果エリア (2カラム) */
        .result-layout {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            /* 高さが詰まってもスクロールしないように調整 */
            overflow: hidden; 
        }
        .result-column h3 {
            font-size: 0.9rem; color: var(--sub-text-color); margin: 0 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;
        }

        .capacity-display {
            text-align: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .capacity-main { font-size: 1.8rem; font-weight: bold; color: var(--highlight-text); }
        .capacity-sub { font-size: 0.85rem; color: var(--sub-text-color); }

        /* リストアイテム */
        .action-list { list-style: none; padding: 0; margin: 0; }
        .action-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem;
        }
        .action-item:last-child { border-bottom: none; }

        /* アイコン */
        .icon-container {
            width: 28px; height: 28px; margin-right: 8px; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 4px;
        }
        .item-icon-img { 
            width: 80%; height: 80%; object-fit: contain;
            filter: drop-shadow(0 0 1px rgba(255,255,255,0.8)); 
        }
        /* CSS 3D Cube */
        .cube-icon {
            width: 14px; height: 14px; position: relative;
            transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(45deg);
        }
        .cube-face {
            position: absolute; width: 14px; height: 14px;
            background-size: cover; image-rendering: pixelated;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.8)); 
        }
        .cube-face.front { transform: translateZ(7px); filter: brightness(1.1); }
        .cube-face.top   { transform: rotateX(90deg) translateZ(7px); filter: brightness(1.3); }
        .cube-face.right { transform: rotateY(90deg) translateZ(7px); filter: brightness(0.8); }

        .item-name { display: flex; align-items: center; }
        .toast-msg {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 60, 60, 0.9); color: white; padding: 6px 12px; border-radius: 4px;
            font-weight: bold; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }

        .footer-signature { font-size: 0.8rem; color: #2A5669; font-weight: bold; margin-top: auto; text-align: right;}
    </style>
</head>
<body>

<div id="app" style="height: 100%; display: flex; flex-direction: column;">
    <header>
        <h1>Mekanism Planner <small style="font-size: 0.6em; opacity: 0.7;">v7.2</small></h1>
    </header>

    <div class="container">
        <div class="panel-left">
            <div class="card">
                <div class="input-group">
                    <label>幅 X <span class="en-label">/ Width</span></label>
                    <div class="number-control">
                        <input type="number" v-model.number="dims.x" min="3" max="18" @wheel.prevent="handleWheel($event, 'x')">
                    </div>
                </div>
                <div class="input-group">
                    <label>奥行 Z <span class="en-label">/ Depth</span></label>
                    <div class="number-control">
                        <input type="number" v-model.number="dims.z" min="3" max="18" @wheel.prevent="handleWheel($event, 'z')">
                    </div>
                </div>
                <div class="input-group">
                    <label>高さ Y <span class="en-label">/ Height</span></label>
                    <div class="number-control">
                        <input type="number" v-model.number="dims.y" min="3" max="18" @wheel.prevent="handleWheel($event, 'y')">
                    </div>
                </div>

                <button class="toggle-btn" :class="{ inactive: !useGlass }" @click="useGlass = !useGlass">
                    <span>構造用ガラス <span class="en-label">/ Glass</span></span>
                    <span>{{ useGlass ? 'ON' : 'OFF' }}</span>
                </button>
            </div>
            
            <div class="footer-signature">edamae</div>
        </div>

        <div class="panel-right">
            <div class="view-wrapper">
                <div id="three-canvas"></div>
                
                <div class="palette">
                    <div v-for="tool in tools" :key="tool.id" 
                         class="tool-btn" 
                         :class="{ active: currentTool === tool.id }"
                         @click="currentTool = tool.id">
                        
                        <div v-if="tool.isBlock" class="cube-icon">
                            <div class="cube-face front" :style="{ backgroundImage: 'url(' + getIconPath(tool.iconName) + ')' }"></div>
                            <div class="cube-face top" :style="{ backgroundImage: 'url(' + getIconPath(tool.iconName) + ')' }"></div>
                            <div class="cube-face right" :style="{ backgroundImage: 'url(' + getIconPath(tool.iconName) + ')' }"></div>
                        </div>
                        <div class="tool-tooltip">{{ tool.label }}</div>
                    </div>

                    <div class="tool-btn" @click="resetAll">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2">
                            <path d="M3 6h18 M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2 M10 11v6 M14 11v6" />
                        </svg>
                        <div class="tool-tooltip">Reset All (リセット)</div>
                    </div>
                </div>

                <div class="toast-msg" :class="{ show: toastMessage }">{{ toastMessage }}</div>
            </div>

            <div class="card" style="flex: 0 0 auto;">
                <div class="capacity-display">
                    <div class="capacity-main">{{ formatNumber(volume * 16000) }} <span style="font-size:1rem">mB</span></div>
                    <div class="capacity-sub">Gas: {{ formatNumber(volume * 160000) }} mB</div>
                </div>

                <div class="result-layout">
                    <div class="result-column">
                        <h3>Blocks</h3>
                        <ul class="action-list">
                            <li v-for="(count, name) in blocks" :key="name" class="action-item">
                                <div class="item-name">
                                    <div class="icon-container">
                                        <div v-if="isBlock(name)" class="cube-icon">
                                            <div class="cube-face front" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                            <div class="cube-face top" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                            <div class="cube-face right" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                        </div>
                                        <img v-else :src="getIconPath(name)" class="item-icon-img" @error="onImgError">
                                    </div>
                                    <div>{{ translate(name) }}</div>
                                </div>
                                <div style="font-weight: bold;">{{ count }}</div>
                            </li>
                        </ul>
                    </div>

                    <div class="result-column">
                        <h3>Raw Materials</h3>
                        <ul class="action-list">
                            <li v-for="(count, name) in rawMaterials" :key="name" class="action-item">
                                <div class="item-name">
                                    <div class="icon-container">
                                        <div v-if="isBlock(name)" class="cube-icon">
                                            <div class="cube-face front" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                            <div class="cube-face top" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                            <div class="cube-face right" :style="{ backgroundImage: 'url(' + getIconPath(name) + ')' }"></div>
                                        </div>
                                        <img v-else :src="getIconPath(name)" class="item-icon-img" @error="onImgError">
                                    </div>
                                    <div style="font-size: 0.9em;">{{ translate(name) }}</div>
                                </div>
                                <div style="font-weight: bold;">{{ count }}</div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const { createApp, ref, computed, watch, onMounted, onBeforeUnmount } = Vue;

    createApp({
        setup() {
            const dims = ref({ x: 3, y: 5, z: 3 });
            const useGlass = ref(true);
            const valveCoords = ref(new Set()); // "ix,iy,iz"
            const toastMessage = ref('');
            let toastTimer = null;
            
            // 現在選択中のツール (現在はvalveのみ)
            const currentTool = ref('valve'); 

            // 拡張用ツール定義
            const tools = [
                { id: 'valve', label: 'Place Valve', iconName: 'Dynamic Valve', isBlock: true, allowedOn: ['wall'] }
                // 将来的に 'port', 'casing' などを追加可能
            ];

            const translations = {
                'Dynamic Tank': 'ダイナミックタンク', 'Structural Glass': '構造用ガラス', 'Dynamic Valve': 'ダイナミックバルブ',
                'Steel Ingot': '鋼鉄インゴット', 'Bucket': 'バケツ', 'Glass': 'ガラス', 'Basic Control Circuit': '基本制御回路'
            };
            const iconMap = {
                'Dynamic Tank': './assets/dynamic_tank.png', 'Structural Glass': './assets/structural_glass.png',
                'Dynamic Valve': './assets/dynamic_valve.png', 'Steel Ingot': './assets/ingot_steel.png',
                'Bucket': './assets/bucket.png', 'Glass': './assets/glass.png',
                'Basic Control Circuit': './assets/basic_control_circuit.png'
            };
            const recipes = {
                'Dynamic Valve': { 'Dynamic Tank': 2, 'Basic Control Circuit': 0.5 },
                'Dynamic Tank': { 'Steel Ingot': 1, 'Bucket': 0.25 },
                'Structural Glass': { 'Steel Ingot': 1, 'Glass': 0.25 }
            };
            const textures = { tank: null, glass: null, valve: null };

            const translate = (key) => translations[key] || key;
            const getIconPath = (key) => iconMap[key] || '';
            const onImgError = (e) => { e.target.style.display = 'none'; };
            const formatNumber = (n) => n.toLocaleString();
            const isBlock = (name) => ['Dynamic Tank', 'Structural Glass', 'Dynamic Valve', 'Glass'].includes(name);

            const showToast = (msg) => {
                toastMessage.value = msg;
                if(toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => { toastMessage.value = ''; }, 2000);
            };

            const handleWheel = (e, target) => {
                const delta = e.deltaY < 0 ? 1 : -1;
                let v = dims.value[target] + delta;
                if(v < 3) v = 3; if(v > 18) v = 18;
                dims.value[target] = v;
            };

            const resetAll = () => {
                if(confirm("配置されたバルブをすべて削除しますか？\n(Reset all valves?)")) {
                    valveCoords.value.clear();
                    updateMesh();
                }
            };

            const volume = computed(() => {
                const { x, y, z } = dims.value;
                if(x < 3 || y < 3 || z < 3) return 0;
                return (x - 2) * (y - 2) * (z - 2);
            });

            // 基準点維持のためのバリデーション (0〜dim-1)
            const validateValves = () => {
                const { x, y, z } = dims.value;
                const toDelete = [];
                valveCoords.value.forEach(coord => {
                    const [ix, iy, iz] = coord.split(',').map(Number);
                    // 範囲外チェック
                    if (ix < 0 || ix >= x || iy < 0 || iy >= y || iz < 0 || iz >= z) {
                        toDelete.push(coord); return;
                    }
                    // 表面チェック (フレーム判定)
                    const onX = (ix === 0 || ix === x - 1);
                    const onY = (iy === 0 || iy === y - 1);
                    const onZ = (iz === 0 || iz === z - 1);
                    const surfaceCount = (onX ? 1 : 0) + (onY ? 1 : 0) + (onZ ? 1 : 0);
                    if (surfaceCount !== 1) toDelete.push(coord);
                });
                toDelete.forEach(k => valveCoords.value.delete(k));
            };

            const blocks = computed(() => {
                const { x, y, z } = dims.value;
                const frameCount = (4 * x) + (4 * y) + (4 * z) - 16;
                const totalShell = (x * y * z) - ((x - 2) * (y - 2) * (z - 2));
                const totalWall = totalShell - frameCount;
                let validValveCount = valveCoords.value.size;
                let result = {};
                if (validValveCount > 0) result['Dynamic Valve'] = validValveCount;
                result['Dynamic Tank'] = frameCount;
                const remainingWall = Math.max(0, totalWall - validValveCount);
                if (useGlass.value) result['Structural Glass'] = remainingWall;
                else result['Dynamic Tank'] += remainingWall;
                return result;
            });

            const rawMaterials = computed(() => {
                let totals = {};
                const decompose = (itemName, quantity) => {
                    const recipe = recipes[itemName];
                    if (recipe) for (const [subItem, subQty] of Object.entries(recipe)) decompose(subItem, subQty * quantity);
                    else totals[itemName] = (totals[itemName] || 0) + quantity;
                };
                for (const [name, count] of Object.entries(blocks.value)) decompose(name, count);
                let rounded = {};
                for (const [k, v] of Object.entries(totals)) rounded[k] = Math.ceil(v);
                return rounded;
            });

            // --- Three.js Logic ---
            let scene, camera, renderer, controls, meshGroup;
            let raycaster, mouse;
            let interactiveMeshes = [];
            let isDragging = false;
            let mouseDownPos = { x: 0, y: 0 };
            let mouseDownTime = 0;

            const initThree = () => {
                const wrapper = document.querySelector('.view-wrapper');
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(50, wrapper.clientWidth / wrapper.clientHeight, 0.1, 100);
                camera.position.set(10, 8, 12); 

                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                
                document.getElementById('three-canvas').appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                
                const dl = new THREE.DirectionalLight(0xffffff, 1.2);
                dl.position.set(10, 20, 10);
                scene.add(dl);
                scene.add(new THREE.AmbientLight(0x404040));

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();

                window.addEventListener('resize', onResize);
                renderer.domElement.addEventListener('pointerdown', onPointerDown);
                renderer.domElement.addEventListener('pointerup', onPointerUp);
                renderer.domElement.addEventListener('pointermove', onPointerMove);

                const tl = new THREE.TextureLoader();
                const loadTex = (p, k) => tl.load(p, t => { t.magFilter = THREE.NearestFilter; textures[k] = t; updateMesh(); });
                loadTex('./assets/dynamic_tank.png', 'tank');
                loadTex('./assets/structural_glass.png', 'glass');
                loadTex('./assets/dynamic_valve.png', 'valve');

                updateMesh();
                animate();
            };

            const onResize = () => {
                const wrapper = document.querySelector('.view-wrapper');
                if (!wrapper || !camera || !renderer) return;
                camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
            };

            const onPointerMove = (event) => {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveMeshes);

                let cursor = 'default';
                if (intersects.length > 0) {
                    const hit = intersects[0];
                    if(hit.object.userData.coords && hit.object.userData.coords[hit.instanceId]){
                        const { type } = hit.object.userData.coords[hit.instanceId];
                        const tool = tools.find(t => t.id === currentTool.value);
                        // Wallなら設置可、Valveなら削除可
                        if (tool && ( (type === 'wall' && tool.allowedOn.includes('wall')) || type === 'valve') ) {
                            cursor = 'pointer';
                        }
                    }
                }
                renderer.domElement.style.cursor = cursor;
            };

            const onPointerDown = (event) => {
                isDragging = false;
                mouseDownPos = { x: event.clientX, y: event.clientY };
                mouseDownTime = performance.now();
            };

            const onPointerUp = (event) => {
                if (event.button !== 0 && event.button !== 2) return;
                const moveDist = Math.hypot(event.clientX - mouseDownPos.x, event.clientY - mouseDownPos.y);
                if (moveDist > 5 || (performance.now() - mouseDownTime) > 300) return; 

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveMeshes);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    const { ix, iy, iz, type } = hit.object.userData.coords[hit.instanceId];
                    const coordKey = `${ix},${iy},${iz}`;
                    
                    const tool = tools.find(t => t.id === currentTool.value);
                    if (!tool) return;

                    if (event.button === 0) { // 左クリック: 設置
                        if (type === 'wall' && tool.allowedOn.includes('wall')) {
                            valveCoords.value.add(coordKey);
                            updateMesh();
                        } else if (type === 'frame') {
                            showToast("フレームには設置できません");
                        }
                    } else if (event.button === 2) { // 右クリック: 削除
                        if (type === 'valve') {
                            valveCoords.value.delete(coordKey);
                            updateMesh();
                        }
                    }
                }
            };

            const updateMesh = () => {
                if(!scene) return;
                if(meshGroup) {
                    scene.remove(meshGroup);
                    meshGroup.children.forEach(c => {
                        if(c.geometry) c.geometry.dispose();
                        if(c.material) (Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose());
                    });
                }
                meshGroup = new THREE.Group();
                scene.add(meshGroup);
                interactiveMeshes = [];

                const { x, y, z } = dims.value;
                const frames=[], walls=[], valves=[];
                const frameCoords=[], wallCoords=[], valveCoordsArr=[];

                for(let ix=0; ix<x; ix++) {
                    for(let iy=0; iy<y; iy++) {
                        for(let iz=0; iz<z; iz++) {
                            // --- 座標計算 (重要: 左・下・手前基準) ---
                            // X: 0が左 (通常) -> pos = ix - offset
                            // Y: 0が下 (通常) -> pos = iy - offset
                            // Z: 0が手前(+Z) -> pos = offset - iz  (逆転させることで手前を0にする)
                            
                            const posX = ix - (x-1)/2;
                            const posY = iy - (y-1)/2;
                            // Zは手前(0)が +Z側に来るように反転
                            const posZ = (z-1)/2 - iz; 

                            const isXEdge = (ix === 0 || ix === x - 1);
                            const isYEdge = (iy === 0 || iy === y - 1);
                            const isZEdge = (iz === 0 || iz === z - 1);
                            const edgeCount = (isXEdge?1:0) + (isYEdge?1:0) + (isZEdge?1:0);

                            const mat = new THREE.Matrix4().setPosition(posX, posY, posZ);
                            const coordObj = { ix, iy, iz }; 
                            const coordKey = `${ix},${iy},${iz}`;

                            if (edgeCount >= 2) {
                                frames.push(mat); frameCoords.push({ ...coordObj, type: 'frame' });
                            } else if (edgeCount === 1) {
                                if (valveCoords.value.has(coordKey)) {
                                    valves.push(mat); valveCoordsArr.push({ ...coordObj, type: 'valve' });
                                } else {
                                    walls.push(mat); wallCoords.push({ ...coordObj, type: 'wall' });
                                }
                            }
                        }
                    }
                }

                const geo = new THREE.BoxGeometry(1,1,1);
                const makeMesh = (list, tex, coords, isGlass=false, isValve=false) => {
                    if(!list.length) return;
                    const mat = new THREE.MeshLambertMaterial({ color: tex ? 0xffffff : 0x555555, map: tex });
                    if(isGlass && useGlass.value) {
                         mat.color.setHex(tex ? 0xffffff : 0x5d9bc0);
                         mat.transparent = true; mat.opacity = tex ? 1.0 : 0.3;
                         mat.side = THREE.DoubleSide; mat.depthWrite = false;
                    } else if (isValve) {
                         mat.color.setHex(tex ? 0xffffff : 0xaa8800);
                    }
                    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
                    list.forEach((m,i)=>mesh.setMatrixAt(i,m));
                    mesh.userData.coords = coords;
                    meshGroup.add(mesh);
                    interactiveMeshes.push(mesh);
                };

                makeMesh(frames, textures.tank, frameCoords);
                makeMesh(valves, textures.valve, valveCoordsArr, false, true);
                makeMesh(walls, useGlass.value ? textures.glass : textures.tank, wallCoords, true);
            };

            const animate = () => {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            };

            watch(dims, () => { validateValves(); updateMesh(); }, { deep: true });
            watch(useGlass, updateMesh);

            onMounted(() => {
                // 初期配置: 0,0,0 (左下の手前)
                valveCoords.value.add("1,0,0"); // 手前中央下
                valveCoords.value.add("1,0,2"); // 奥中央下 (size3の場合)
                initThree();
                setTimeout(onResize, 100);
            });
            onBeforeUnmount(() => { window.removeEventListener('resize', onResize); });

            return {
                dims, useGlass, volume, blocks, rawMaterials,
                formatNumber, translate, getIconPath, onImgError,
                handleWheel, toastMessage, isBlock, 
                currentTool, tools, resetAll
            };
        }
    }).mount('#app');
</script>
</body>
</html>
